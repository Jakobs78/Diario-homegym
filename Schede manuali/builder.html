<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Builder Mesociclo - HomeGym</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #3b82f6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #374151;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }
        .wizard-container {
            max-width: 600px;
            margin: 0 auto;
        }
        .step-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }
        h2 { font-size: 1.25rem; margin-top: 0; color: var(--primary); }
        label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 0.9rem; }
        input, select {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 16px;
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
        }
        button:active { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="wizard-container">
        <div style="margin-bottom: 16px;">
            <a href="builder.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 6px;">
                ← Torna alla Webapp
            </a>
        </div>
        <h1>Creazione Guidata Mesociclo</h1>
        <p style="color: var(--text-muted); margin-bottom: 24px;">Configura la tua scheda da smartphone ed esporta il file pronto per la webapp.</p>
        <div class="step-card" id="step-1">
            <h2>1. Dati Principali</h2>
            <label for="mesoName">Nome Mesociclo</label>
            <input type="text" id="mesoName" value="Mesociclo Forza & Ipertrofia">

            <label for="durationWeeks">Durata (Settimane)</label>
            <select id="durationWeeks">
                <option value="4" selected>4 Settimane</option>
                <option value="5">5 Settimane</option>
                <option value="6">6 Settimane</option>
            </select>

            <label for="progressionType">Metodo di Programmazione</label>
            <select id="progressionType">
                <option value="none" selected>Ipertrofia (Carico Fisso / Doppia Progressione)</option>
                <option value="load">Forza (Progressione Lineare di Carico)</option>
            </select>

            <label for="stepKg">Incremento di Carico (Step Kg)</label>
            <select id="stepKg">
                <option value="0.5">0.5 kg</option>
                <option value="1" selected>1.0 kg</option>
                <option value="2">2.0 kg</option>
                <option value="2.5">2.5 kg</option>
            </select>
            <button id="btnNextToExercises">Avanti: Inserisci Esercizi</button>
        </div>

        <div class="step-card" id="step-2" style="display: none;">
            <h2>2. Composizione Giorni</h2>
            
            <div id="exercises-list"></div>

            <button type="button" id="btnGenerate" style="margin-top: 16px; background: #10b981;">Genera e Scarica File CSV</button>
        </div>
    </div>

    <div id="exerciseModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; padding: 16px; box-sizing: border-box; overflow-y: auto;">
        <div style="background: var(--card-bg); max-width: 500px; margin: 40px auto; border-radius: 12px; padding: 20px; border: 1px solid var(--border);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="margin: 0; color: var(--primary);">Seleziona Esercizio</h3>
                <button type="button" id="btnCloseModal" style="background: transparent; border: none; color: var(--text-muted); font-size: 1.2rem; width: auto; padding: 4px 8px;">✕</button>
            </div>
            
            <input type="text" id="exSearchInput" placeholder="Cerca (es. Panca, Squat, Trazioni)..." style="margin-bottom: 12px;">
            
            <div id="dbExercisesList" style="max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;"></div>

            <div style="margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px;">
                <p style="font-size: 0.85rem; color: var(--text-muted); margin: 0 0 8px 0;">Non lo trovi in elenco?</p>
                <button type="button" id="btnCustomExercise" style="background: #374151; font-size: 0.9rem;">+ Inserisci personalizzato</button>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { wizardState } from './js/state.js';
        import { generateMesocycleData } from './js/engine.js';
        import { downloadMesocycleFile } from './js/exporter.js';
        import { exerciseDatabase } from './js/exerciseDB.js';

        const step1 = document.getElementById('step-1');
        const step2 = document.getElementById('step-2');
        const exercisesList = document.getElementById('exercises-list');
        const exerciseModal = document.getElementById('exerciseModal');
        const dbExercisesList = document.getElementById('dbExercisesList');
        const exSearchInput = document.getElementById('exSearchInput');

        let activeDayNumber = 1;

        function renderBuilderUI() {
            exercisesList.innerHTML = '';

            const uniqueDays = [...new Set(wizardState.exercises.map(ex => ex.dayNumber))].sort((a, b) => a - b);

            let daysTabsHTML = `<div style="display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px;">`;
            uniqueDays.forEach(dayNum => {
                const isActive = dayNum === activeDayNumber;
                const bgBtn = isActive ? 'var(--primary)' : '#2a2a2a';
                daysTabsHTML += `<button type="button" class="day-tab-btn" data-day="${dayNum}" style="background: ${bgBtn}; padding: 8px 14px; font-size: 0.9rem; width: auto; flex-shrink: 0;">Giorno ${dayNum}</button>`;
            });
            daysTabsHTML += `
                <button type="button" id="btnAddDayAuto" style="background: #374151; padding: 8px 14px; font-size: 0.9rem; width: auto; flex-shrink: 0;">+ Aggiungi Giorno</button>
            </div>`;

            exercisesList.innerHTML += daysTabsHTML;

            const activeExercises = wizardState.exercises.filter(ex => ex.dayNumber === activeDayNumber);

            exercisesList.innerHTML += `<h3 style="font-size: 1rem; color: var(--text-muted); margin-bottom: 12px;">Esercizi per Giorno ${activeDayNumber}</h3>`;

            if (activeExercises.length === 0) {
                exercisesList.innerHTML += `<p style="color: var(--text-muted); font-size: 0.9rem; text-align: center; padding: 10px;">Nessun esercizio inserito per questo giorno.</p>`;
            } else {
               activeExercises.forEach((ex, index) => {
                    const globalIndex = wizardState.exercises.indexOf(ex);
                    exercisesList.innerHTML += `
                        <div style="background: #2a2a2a; padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <p style="margin: 0 0 4px 0; font-weight: bold; color: var(--primary);">#${index + 1} - ${ex.name}</p>
                                <span style="font-size: 0.8rem; color: var(--text-muted);">Serie: ${ex.sets.length} | Reps: ${ex.reps} | Kg: ${ex.kgMin || 'Libero'}</span>
                            </div>
                            <div style="display: flex; gap: 6px;">
                                <button type="button" class="btn-edit-ex" data-index="${globalIndex}" style="background: #374151; padding: 6px 10px; font-size: 0.8rem; width: auto;">Modifica</button>
                                <button type="button" class="btn-remove-ex" data-index="${globalIndex}" style="background: #ef4444; padding: 6px 10px; font-size: 0.8rem; width: auto;">Elimina</button>
                            </div>
                        </div>
                    `;
                });
            }

            exercisesList.innerHTML += `
                <button type="button" id="btnAddExerciseToActiveDay" style="background: #374151; margin-top: 8px;">+ Aggiungi Esercizio da Archivio</button>
            `;

            document.querySelectorAll('.day-tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    activeDayNumber = parseInt(e.target.getAttribute('data-day'));
                    renderBuilderUI();
                });
            });

            document.querySelectorAll('.btn-remove-ex').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(e.target.getAttribute('data-index'));
                    wizardState.exercises.splice(idx, 1);
                    renderBuilderUI();
                });
            });

            document.getElementById('btnAddDayAuto').addEventListener('click', () => {
                const maxDay = uniqueDays.length > 0 ? Math.max(...uniqueDays) : 0;
                activeDayNumber = maxDay + 1;
                renderBuilderUI();
            });

            document.getElementById('btnAddExerciseToActiveDay').addEventListener('click', () => {
                exSearchInput.value = '';
                renderModalList('');
                exerciseModal.style.display = 'block';
                exSearchInput.focus();
            });

            document.querySelectorAll('.btn-edit-ex').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(e.target.getAttribute('data-index'));
                    const ex = wizardState.exercises[idx];
                    
                    const newReps = prompt("Modifica target ripetizioni:", ex.reps);
                    if (newReps !== null) ex.reps = newReps;

                    const newKg = prompt("Modifica carico minimo (kg):", ex.kgMin);
                    if (newKg !== null) {
                        ex.kgMin = newKg;
                        ex.kgMax = (parseFloat(newKg) + 5).toString();
                    }

                    renderBuilderUI();
                });
            });
        }

        function renderModalList(filterText) {
            dbExercisesList.innerHTML = '';
            const filtered = exerciseDatabase.filter(ex => 
                ex.name.toLowerCase().includes(filterText.toLowerCase()) || 
                ex.category.toLowerCase().includes(filterText.toLowerCase())
            );

            if (filtered.length === 0) {
                dbExercisesList.innerHTML = `<p style="color: var(--text-muted); text-align: center; font-size: 0.9rem; padding: 12px;">Nessun esercizio trovato.</p>`;
                return;
            }

            filtered.forEach(ex => {
                const item = document.createElement('div');
                item.style.cssText = "background: #2a2a2a; padding: 10px 14px; border-radius: 8px; cursor: pointer; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;";
                item.innerHTML = `
                    <div>
                        <strong style="display: block; color: var(--text-main); font-size: 0.95rem;">${ex.name}</strong>
                        <span style="font-size: 0.75rem; color: var(--text-muted);">${ex.category}</span>
                    </div>
                    <span style="color: var(--primary); font-size: 0.85rem; font-weight: bold;">+ Aggiungi</span>
                `;

                item.addEventListener('click', () => {
                    appendExerciseToState(ex.name, ex.defaultReps, ex.defaultKg);
                    exerciseModal.style.display = 'none';
                });

                dbExercisesList.appendChild(item);
            });
        }

        function appendExerciseToState(name, defaultReps, defaultKg) {
            const reps = prompt("Target ripetizioni:", defaultReps) || defaultReps;
            const setsCount = parseInt(prompt("Numero di serie:", "3")) || 3;
            const kgMin = prompt("Carico minimo di partenza (kg):", defaultKg) || defaultKg;

            const setsArray = [];
            for(let i=1; i<=setsCount; i++) {
                setsArray.push({ setNumber: i, reps: reps, weight: '' });
            }

            wizardState.exercises.push({
                dayNumber: activeDayNumber,
                block: 1,
                name: name,
                reps: reps,
                kgMin: kgMin,
                kgMax: (parseFloat(kgMin) + 5).toString(),
                rpe: "@8",
                sets: setsArray
            });

            renderBuilderUI();
        }

        exSearchInput.addEventListener('input', (e) => {
            renderModalList(e.target.value);
        });

        document.getElementById('btnCloseModal').addEventListener('click', () => {
            exerciseModal.style.display = 'none';
        });

        document.getElementById('btnCustomExercise').addEventListener('click', () => {
            exerciseModal.style.display = 'none';
            const name = prompt("Nome dell'esercizio personalizzato:");
            if (!name) return;
            appendExerciseToState(name, "8-10", "50");
        });

        document.getElementById('btnNextToExercises').addEventListener('click', () => {
            wizardState.config.name = document.getElementById('mesoName').value;
            wizardState.config.durationWeeks = parseInt(document.getElementById('durationWeeks').value);
            wizardState.config.progressionType = document.getElementById('progressionType').value;
            wizardState.config.stepKg = parseFloat(document.getElementById('stepKg').value);

            step1.style.display = 'none';
            step2.style.display = 'block';
            
            if(wizardState.exercises.length === 0) {
                wizardState.exercises.push({
                    dayNumber: 1,
                    block: 1,
                    name: "Panca Piana con Bilanciere",
                    reps: "6-8",
                    kgMin: "80",
                    kgMax: "85",
                    rpe: "@8",
                    sets: [ {setNumber:1}, {setNumber:2}, {setNumber:3}, {setNumber:4} ]
                });
            }
            activeDayNumber = 1;
            renderBuilderUI();
        });

        document.getElementById('btnGenerate').addEventListener('click', () => {
            if (wizardState.exercises.length === 0) {
                alert("Aggiungi almeno un esercizio prima di generare il mesociclo.");
                return;
            }

            const mesoObj = generateMesocycleData(wizardState);
            downloadMesocycleFile(mesoObj);
            
            alert("File CSV generato e scaricato con successo!");
        });
    </script>
</body>
</html>

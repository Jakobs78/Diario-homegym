<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario HomeGym - Advanced Workout Tracker</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Chart.js per le Dashboard e i Grafici -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
    <!-- Per navigare correttamente nella gerarchia dei dati Anni-mesocicli-settimane ecc... -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <!-- Finestra di Autenticazione Supabase -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h2 id="auth-title">Accedi al Diario</h2>
            <div id="auth-error" style="color: #dc2626; font-size: 0.8rem; margin-bottom: 10px; display: none;"></div>
            <input type="email" id="auth-email" placeholder="Email">
            <input type="password" id="auth-password" placeholder="Password">
            <button class="btn" style="width: 100%; padding: 10px;" id="auth-submit-btn">Accedi</button>
            <span class="auth-toggle" id="auth-toggle-text">Non hai un account? Registrati</span>
        </div>
    </div>

    <div class="container">
        <!-- Header Principale -->
        <header>
            <h1>🏋️ HomeGym Diary</h1>
            <div style="display: flex; gap: 6px; align-items: center;">
                <span id="sync-status" class="sync-badge" title="Stato sincronizzazione cloud">🟢 Sincronizzato</span>
                <span id="user-email-display" style="font-size: 0.8rem; color: var(--text-muted);"></span>    
                <button class="btn btn-secondary" id="theme-toggle-btn">🌙 Dark</button>
                <button class="btn btn-secondary" id="user-info-bar" style="display: none; align-items: center; gap: 6px;" title="Esci">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Esci
                </button>
            </div>
        </header>

        <!-- Barra Controlli -->
        <div class="controls-bar">
            <!-- Riga Principale: Data, Mesociclo e Analytics -->
            <div class="control-row" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
                    <div style="display: flex; gap: 6px; align-items: center;">
                        <label style="font-size: 0.8rem; font-weight: 600;">Data:</label>
                        <input type="date" id="meta-date" data-id="meta-date">
                    </div>
                    <div style="display: flex; gap: 6px; align-items: center;">
                        <label style="font-size: 0.8rem; font-weight: 600;">Mesociclo:</label>
                        <button class="btn btn-secondary" id="prev-meso-btn" style="padding: 2px 6px;">-</button>
                        <span id="meso-display" style="font-weight: 700; font-size: 0.9rem;">1</span>
                        <button class="btn btn-secondary" id="next-meso-btn" style="padding: 2px 6px;">+</button>
                    </div>
                </div>

                <!-- Pulsante per aprire il menu analisi allenamenti -->
                <button id="open-analytics-btn" class="analytics-trigger-btn">
                    📊 Analisi & Dashboards
                </button>

                <!-- Bottom Sheet (Menu da basso) -->
                <div id="analytics-modal" class="bottom-sheet-overlay hidden">
                    <div class="bottom-sheet-content">
                        <div class="bottom-sheet-header">
                            <span>Seleziona Vista</span>
                            <button id="close-analytics-btn" class="close-sheet">&times;</button>
                        </div>
                        <div class="bottom-sheet-menu">
                            <button class="sheet-item" data-view="workout">🏋️ Allenamento</button>
                            <button class="sheet-item" data-view="stats">📈 Statistiche</button>
                            <button class="sheet-item" data-view="progress">🎯 Progressi</button>
                            <button class="sheet-item" data-view="macro-progress">📊 Macro Progressi</button>
                        </div>
                    </div>
                </div>
            
                <!-- Pulsante di apertura menu strumenti e gestione -->
        <button id="open-tools-btn" class="tools-trigger-btn">
            ⚙️ Strumenti & Gestione
        </button>

        <!-- Hidden file inputs per la gestione CSV -->
        <input type="file" id="import-plan-input" accept=".csv" style="display: none;">
        <input type="file" id="import-history-input" accept=".csv" style="display: none;">

        <!-- Bottom Sheet Strumenti & Gestione -->
        <div id="tools-modal" class="bottom-sheet-overlay hidden">
            <div class="bottom-sheet-content">
                <div class="bottom-sheet-header">
                    <span>⚙️ Strumenti & Gestione</span>
                    <button id="close-tools-btn" class="close-sheet">&times;</button>
                </div>
                <div class="bottom-sheet-menu">
                    <button class="sheet-item" data-action="manual">📖 Manuale d'uso</button>
                    <button class="sheet-item" data-action="export-pdf">🖨️ PDF giornaliero</button>
                    <button class="sheet-item" data-action="import-plan">📂 Importa scheda CSV mesociclo</button>
                    <button class="sheet-item" data-action="export-csv">💾 Backup storico CSV</button>
                    <button class="sheet-item" data-action="import-history">📥 Import storico CSV</button>

                    <!-- Separatore Zona Pericolosa -->
                    <hr class="sheet-divider">
                    <span class="sheet-section-title">Zona Pericolosa</span>

                    <button class="sheet-item sheet-item-danger" data-action="reset-meso">
                        🗑️ Elimina scheda mesociclo
                    </button>
                    <button class="sheet-item sheet-item-danger-critical" data-action="clear-data">
                        ⚠️ Elimina tutto!
                    </button>
                </div>
            </div>
        </div>

        <!-- Contenitore della barra di navigazione (Settimana + Giorni) -->
        <div class="tabs" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
            <div style="display: flex; gap: 4px; align-items: center; background: var(--bg-card); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border-color);">
                <label for="week-selector" style="font-size: 0.75rem; font-weight: 700;">Settimana:</label>
                <select id="week-selector" style="font-size: 0.75rem; padding: 2px 4px;">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
            </div>
            <div id="dynamic-day-tabs" style="display: flex; gap: 4px; align-items: center;"></div>
        </div>

        <!-- Lista e Contenitori Allenamento -->
        <div id="workout-list-container"></div>

        <!-- Viste Dashboard -->
        <div class="day-view" id="stats" style="display: none;">
            <div class="day-card">
                <div class="day-title"><span>Dashboard Volume Muscolare</span></div>
                <div id="stats-content"></div>
            </div>
        </div>

        <div class="day-view" id="progress" style="display: none;">
            <div class="day-card">
                <div class="day-title"><span>Progressi & Analitiche Mesociclo</span></div>
                <div id="progress-content"></div>
            </div>
        </div>

        <div class="day-view" id="macro-progress" style="display: none;">
            <div class="day-card">
                <div class="day-title"><span>Macro Progressione Pluriennale (1RM)</span></div>
                <div id="macro-progress-content"></div>
            </div>
        </div>

        <div class="day-view" id="manual" style="display: none;">
            <div class="day-card">
                <div class="day-title"><span>Manuale di Istruzioni</span></div>
                <div id="manual-content"></div>
            </div>
        </div>
    </div>

    <!-- Timer Mobile Flottante -->
    <div id="floating-timer">
        <div>
            <div style="font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700;">Recupero</div>
            <div id="timer-display">01:30</div>
        </div>
        <div style="display: flex; gap: 4px;">
            <button class="btn btn-secondary" id="timer-minus-15" style="padding: 4px 8px; font-size: 0.75rem;">-15s</button>
            <button class="btn btn-secondary" id="timer-plus-30" style="padding: 4px 8px; font-size: 0.75rem;">+30s</button>
            <button class="btn btn-danger" id="stop-timer-btn" style="padding: 4px 8px; font-size: 0.75rem;">✕</button>
        </div>
    </div>

    <!-- Script Entry Point ES6 Modulare -->
    <script type="module" src="js/main.js"></script>

    <!-- Registrazione Service Worker per supporto Offline completo -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(() => console.log('✅ Service Worker attivo: webapp pronta per l\'uso offline'))
            .catch(err => console.error('❌ Errore Service Worker:', err));
        });
      }
    </script>
    
</body>
</html>
